<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="420" viewBox="0 0 1040 420" role="img" aria-label="ネットワーク構成図。PC-A、スイッチ、機器X、PC-Bが左から接続されている">
<rect width="1040" height="420" fill="white"/>
<style>text{font-family:'Noto Sans JP','Yu Gothic',Meiryo,sans-serif;fill:#25517e} .head{font-size:29px;font-weight:bold} .name{font-size:29px;text-anchor:middle}.sub{font-size:22px;text-anchor:middle;fill:#3c566d}.note{font-size:22px;fill:#2f3f4d}.box{fill:#ecf3fa;stroke:#4379a6;stroke-width:4}</style>
<text x="30" y="54" class="head">ネットワーク構成図（デモ）</text>
<path d="M210 155H305 M515 155H610 M785 155H860" stroke="#2f3f4d" stroke-width="5"/>
<rect x="35" y="95" width="175" height="120" rx="12" class="box"/><text x="122" y="145" class="name">PC-A</text><text x="122" y="185" class="sub">192.168.1.10</text>
<rect x="305" y="95" width="210" height="120" rx="12" class="box"/><text x="410" y="145" class="name">スイッチ</text><text x="410" y="185" class="sub">192.168.1.0/24</text>
<rect x="610" y="95" width="175" height="120" rx="12" class="box"/><text x="697" y="145" class="name">機器 X</text><text x="697" y="185" class="sub">中継装置</text>
<rect x="860" y="95" width="160" height="120" rx="12" class="box"/><text x="940" y="145" class="name">PC-B</text><text x="940" y="185" class="sub">192.168.2.10</text>
<rect x="230" y="268" width="750" height="105" rx="9" fill="#f8f9fb" stroke="#b9c6d1" stroke-width="2"/>
<text x="250" y="313" class="note">PC-A と PC-B は異なる IP ネットワークに属する。</text>
<text x="250" y="354" class="note">IP パケットをネットワーク間で転送する機器を問う。</text>
</svg>