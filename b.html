<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>応用情報 CBT 科目B｜記述式模擬試験（非公式）</title>
<style>
:root{--blue:#134777;--blue2:#23609b;--deep:#16395d;--pale:#f4f6f9;--line:#b9c3ce;--gray:#dadfe4;--txt:#1b2734;--green:#bfe3a7;--red:#ce3446}
*{box-sizing:border-box}html,body{height:100%;margin:0}body{font:14px/1.5 "Noto Sans JP","Yu Gothic",Meiryo,sans-serif;background:#e9ecef;color:var(--txt)}button,input,select,textarea{font:inherit}button{cursor:pointer}button:disabled{opacity:.42;cursor:default}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,[contenteditable]:focus-visible{outline:3px solid #f4b945;outline-offset:1px}button:active:not(:disabled){filter:brightness(.91)}
.btn{border:1px solid #315d89;background:linear-gradient(#2d649c,#164b82);color:#fff;padding:6px 14px;min-height:31px;white-space:nowrap}.btn.secondary{color:#213243;background:linear-gradient(#fff,#e0e4e8);border-color:#939da9}.btn.lightblue{background:linear-gradient(#3c83d9,#1f63c0)}.btn.active,.btn[aria-pressed=true]{background:#8b3043;border-color:#772a3b}.btn.danger{background:#365671}
#app{min-width:760px;min-height:580px;height:100dvh;display:flex;flex-direction:column;border:1px solid #9ba6b0;background:white}
#header{height:91px;flex:0 0 91px;display:grid;grid-template-columns:225px minmax(200px,1fr) auto;gap:10px;align-items:center;background:#fff;border-bottom:7px solid #dfe2e5;padding:8px 13px}
.brand{display:flex;align-items:center;gap:9px}.brandmark{height:48px;width:48px;border-radius:50%;border:2px solid #9eabb7;display:flex;align-items:center;justify-content:center;font-size:17px;font-family:Georgia,serif;color:#214773}.brand small{display:block;color:#5c6874;font-size:10px}.header-center{text-align:center;font-size:17px;line-height:1.35}.header-center small{display:block;font-size:12px;color:#566577}.header-right{align-self:stretch;display:flex;flex-direction:column;align-items:flex-end;justify-content:space-around;gap:6px}.timer{font-size:13px}.timer strong{font:19px/1 Consolas,monospace}.commands{display:flex;align-items:center;gap:5px}.commands .btn{font-size:12px;padding:5px 10px;min-height:27px}.switch{height:22px;width:37px;border-radius:15px;border:1px solid #a2aab2;background:#e9edf1;position:relative}.switch:before{content:"";position:absolute;top:2px;left:2px;height:16px;width:16px;border-radius:50%;background:#8994a0}.switch[aria-pressed=true]:before{left:17px;background:#fff}.switch[aria-pressed=true]{background:#164a80}
#toolbar{min-height:38px;background:#e9edf2;border-bottom:1px solid #b7c0c9;display:flex;align-items:center;gap:7px;padding:4px 12px;flex-wrap:wrap}#toolbar .mini{padding:4px 8px;min-height:26px;font-size:12px}#toolbar input[type=range]{width:130px;accent-color:#1b538d}.marker-options{display:inline-flex;align-items:center;gap:4px;margin-left:7px}.paint{width:25px;height:24px;padding:0;border:2px solid #a1a8b0;background:#fff;min-width:25px}.paint[data-color=red]{background:#f35f6d}.paint[data-color=blue]{background:#536ff1}.paint[data-color=yellow]{background:#fcd348}.paint.active{outline:2px solid #153d68;outline-offset:1px}.marker-size{width:50px;padding:2px;border:1px solid #a4b1bf;background:#fff}
#workspace{flex:1;min-height:0;display:flex;background:#fff}#question-pane{flex:0 0 63%;min-width:265px;display:flex;flex-direction:column;min-height:0;border-right:1px solid #bec7d0}#question-scroll{overflow:auto;flex:1;position:relative;background:#fff}#doc-wrap{position:relative;margin:0;min-height:100%;}#question-document{padding:32px 38px 70px;font-size:16px;line-height:2;white-space:normal;user-select:none;-webkit-user-select:none;overflow-wrap:anywhere}#question-document h2{font-size:19px;margin:0 0 20px;font-weight:650}#question-document h3{font-size:16px;margin:28px 0 9px}#question-document p{margin:0 0 15px;text-indent:1em}#question-document pre{white-space:pre-wrap;background:#f6f7f8;border:1px solid #c8cdd2;padding:13px 17px;font:14px/1.65 Consolas,monospace;text-indent:0}#question-document table{border-collapse:collapse;width:100%;font-size:14px;line-height:1.55;margin:20px 0}#question-document td,#question-document th{border:1px solid #778697;padding:7px 8px;text-align:left}#question-document th{background:#eef2f6}#question-document img{display:block;max-width:100%;height:auto;margin:15px auto}.doc-caption{font-size:12px;text-align:center;color:#66737e}.doc-section-label{font-weight:bold;margin-bottom:10px}#marker-canvas{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none;z-index:2}#doc-wrap.is-marking #marker-canvas{pointer-events:auto;cursor:crosshair;touch-action:none}#splitter{flex:0 0 8px;background:#c7cdd4;border-left:1px solid #9eabb7;border-right:1px solid #9eabb7;position:relative;cursor:col-resize;touch-action:none}#splitter:after{content:"⋮";position:absolute;top:45%;width:100%;text-align:center;color:#777;font-size:18px}
#answers-pane{flex:1;min-width:220px;overflow:auto;padding:14px 16px 45px;background:white}#answers-pane h3{font-size:16px;margin:0 0 12px}.answer-box{position:relative;border-bottom:1px solid #d0d7df;padding:13px 3px 18px;margin-bottom:5px}.answer-box.review::before{content:"";position:absolute;left:-9px;top:10px;bottom:14px;width:4px;background:#d63449}.answer-heading{display:flex;gap:8px;align-items:center;font-weight:bold;margin-bottom:11px}.answer-heading input{width:18px;height:18px;accent-color:#1d548d;margin:0}.answer-prompt{font-size:13px;line-height:1.6;margin-bottom:9px}.choicebtn{min-width:43px;height:31px;border:1px solid #929aa4;background:#f8f8f8;margin:0 5px 5px 0;color:#222}.choicebtn.selected{background:#1a528c;border-color:#1a528c;color:white;font-weight:bold}.multiopt{display:block;border:1px solid #c1c7ce;margin:4px 0;padding:5px 8px;background:#fdfdfd;font-size:13px}.multiopt input{accent-color:#1c548e}.word-input{width:100%;padding:7px;border:1px solid #adb9c5;border-radius:1px;max-width:100%}.drop-input{width:100%;padding:8px;border:1px solid #a3b0bb;background:white}.long-input{width:100%;min-height:118px;resize:both;max-width:100%;border:1px solid #9daaaf;padding:9px 10px;line-height:1.7}.ans-tools{display:flex;gap:4px;margin-top:5px;align-items:center;justify-content:space-between}.ans-tools .btn{font-size:11px;min-height:24px;padding:3px 7px}.count{font-size:11px;color:#64737f}.ans-smalltext{font-size:11px;color:#68737f}.select-note{background:#fff9e7;color:#715d2f;font-size:12px;padding:8px;margin-bottom:10px;border:1px solid #ead7a3}
#foot{flex:0 0 52px;display:flex;gap:7px;align-items:center;padding:8px 13px;border-top:7px solid #e3e6e9;background:#d1d4d8}#foot .btn{font-size:12px;min-width:96px;min-height:29px}.push{margin-left:auto}
.layer{position:fixed;inset:0;background:#142b3d80;z-index:50;display:flex;align-items:center;justify-content:center;padding:20px}.layer.hidden{display:none}.dialog{width:min(780px,96vw);max-height:90vh;overflow:auto;background:#fff;border:1px solid #657a8f;box-shadow:0 16px 45px #0005;padding:23px 26px}.dialog h2{margin:0 0 12px;color:#183c63;font-size:20px}.dialog p{line-height:1.7}.dialog .subtle{font-size:12px;color:#6b7480}.dialog .actions{display:flex;gap:10px;margin-top:20px;align-items:center;justify-content:flex-end;flex-wrap:wrap}.dialog a{color:#164f8f}.dialog .formset{border:1px solid #c9d3de;background:#f7f9fb;padding:12px;margin:12px 0}.dialog .formset label{display:block;margin:6px 0}.dialog input[type=file]{max-width:100%}.dialog select{padding:7px}.dialog .warning{color:#ad3343;font-weight:600}.selection-list{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.select-q{border:1px solid #a7b4c0;padding:10px 9px;display:flex;flex-direction:column;gap:5px;background:#fff;min-height:84px}.select-q strong{font-size:13px}.select-q small{font-size:10px;color:#6b7985}.select-q input{width:18px;height:18px;accent-color:#1b548d}.selection-status{padding:9px;background:#e9eff6;margin:12px 0;font-weight:600}.selection-status.invalid{background:#fff3ee;color:#a63d31}.dialog .preview-note{color:#475869;margin:8px 0}.review-status-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.review-status-grid button{border:1px solid #879bad;background:#fff;padding:8px 3px}.review-status-grid button.answered{background:#bee39a}.review-status-grid button.reviewed{border:2px solid #ca344e}.review-status-grid button.current{outline:3px solid #e4d02b}.result-table{width:100%;border-collapse:collapse;margin:15px 0}.result-table td,.result-table th{border-bottom:1px solid #cbd5dc;padding:8px;text-align:left}.result-table strong{font-size:19px;color:#194b7d}
.float{position:fixed;z-index:40;display:none;border:1px solid #36547b;box-shadow:0 8px 25px #0005;background:#fff}.float.visible{display:flex;flex-direction:column}.float-header{background:#134777;color:white;height:32px;padding:3px 8px;display:flex;justify-content:space-between;align-items:center;cursor:move;user-select:none}.float-header button{border:0;background:#245889;color:white;padding:3px 7px}.float-header .mode{font-size:11px;background:#246093;border:1px solid #83a0bb}.float-header .mode.active{background:#f2f4f8;color:#134777}.memo{left:calc(50% - 305px);top:10%;width:610px;height:475px;min-width:300px;min-height:275px;resize:both;overflow:hidden}.memo-tools{display:flex;gap:4px;align-items:center;flex-wrap:wrap;background:#eef2f7;padding:5px 8px;border-bottom:1px solid #bfccd9}.memo-tools button{min-height:24px;font-size:11px;padding:3px 7px;border:1px solid #a9b8c7;background:white}.memo-tools .paint{width:20px;height:20px;min-height:20px;padding:0}.memo-search{display:none;background:#f8fafb;padding:5px;gap:7px}.memo-search.visible{display:flex}.memo-search input{flex:1;min-width:70px}.memo-text{flex:1;outline:none;padding:11px;font-size:15px;line-height:26px;overflow:auto;white-space:pre-wrap;overflow-wrap:anywhere;background:repeating-linear-gradient(to bottom,#fff 0,#fff 25px,#dde5f0 25px,#dde5f0 26px)}.memo-text mark.red{background:#ff8995}.memo-text mark.blue{background:#adc3ff}.memo-text mark.yellow{background:#ffdf68}.memo-footer{display:flex;justify-content:space-between;align-items:center;padding:5px 9px;background:#f2f4f7;font-size:11px}.calc{right:10%;top:15%;width:290px;height:auto}.calc-head{display:flex;align-items:center;justify-content:flex-end;background:#080b12;color:white;padding:4px;gap:3px}.calc-head button{font-size:10px;border:1px solid #37567f;color:#fff;background:#1e4a7e;padding:3px 6px}.calc-head button.active{background:#db9e26}.calc-screen{padding:11px;background:white;text-align:right;font:28px Consolas,monospace;height:59px;border-bottom:1px solid #b5b5b5}.calc-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:2px;background:#121c32;padding:2px}.calc-grid button{height:45px;background:#194b81;color:#fff;border:1px solid #0b2d55;font:18px Consolas,monospace}.calc[data-size=small]{width:250px}.calc[data-size=large]{width:360px}.calc[data-size=large] .calc-grid button{height:55px}
body.inverted{filter:invert(1) hue-rotate(180deg)}body.exam-running #question-document,body.exam-running #answers-pane{-webkit-user-select:none;user-select:none}.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}
@media(max-width:950px){#header{grid-template-columns:130px 1fr;height:120px;flex-basis:120px}.header-right{grid-column:1 / -1;flex-direction:row;align-items:center}.brand small{font-size:9px}.commands{flex-wrap:wrap}.commands .btn{font-size:10px;padding:4px 6px}.selection-list{grid-template-columns:repeat(3,1fr)}}@media(max-width:650px){#app{min-width:600px}.selection-list{grid-template-columns:repeat(2,1fr)}}
</style>
</head><body>
<div id="app"><header id="header">
<div class="brand"><div class="brandmark">AP</div><div><b>応用情報技術者試験</b><small>CBT模擬環境（非公式）</small></div></div>
<div class="header-center"><div>科目B　記述式模擬試験</div><small id="current-info">問題選択待ち</small></div>
<div class="header-right"><div class="timer">残り時間 <strong id="remaining">02:30:00</strong></div><div class="commands"><small>白黒反転</small><button id="invert" class="switch" aria-label="白黒反転" aria-pressed="false"></button><button class="btn" id="memo-btn">メモ</button><button class="btn" id="calc-btn">電卓</button><button class="btn" id="new-window">問題（別画面）</button><button class="btn lightblue" id="select-btn">問題選択</button><button class="btn" id="help-btn">注意事項</button><button class="btn" id="finish-btn">試験終了</button></div></div>
</header>
<div id="toolbar"><span style="font-size:12px">拡大・縮小</span><input id="zoom" type="range" min="75" max="160" step="5" value="100"><b id="zoom-label">100%</b><span style="margin-left:14px;font-size:12px">問題文マーカー</span><div class="marker-options"><button type="button" class="paint" data-color="red" aria-label="赤マーカー"></button><button class="paint" data-color="blue" aria-label="青マーカー"></button><button class="paint" data-color="yellow" aria-label="黄マーカー"></button><select id="stroke-size" class="marker-size" aria-label="マーカーの太さ"><option value="8">細</option><option value="18" selected>中</option><option value="27">太</option></select><button class="btn secondary mini" id="clear-markers">マーカー消去</button><button class="btn secondary mini" id="marker-off">解除</button></div></div>
<div id="workspace"><section id="question-pane"><div id="question-scroll"><div id="doc-wrap"><article id="question-document"></article><canvas id="marker-canvas"></canvas></div></div></section><div id="splitter" title="ドラッグして左右の表示幅を変更"></div><aside id="answers-pane"><h3 id="answer-label">解答選択欄</h3><div id="answers"></div></aside></div>
<footer id="foot"><button class="btn" id="status-btn">解答状況</button><button class="btn secondary" id="foot-calc">電卓</button><button class="btn secondary" id="review-all" aria-pressed="false">後で見直す</button><button class="btn push" id="previous">前の問題</button><button class="btn" id="next">次の問題</button></footer></div>
<div class="layer hidden" id="layer"><div class="dialog" id="dialog"></div></div>
<div class="float memo" id="memo-window"><div class="float-header"><label style="font-size:11px;display:flex;gap:4px;align-items:center"><input type="checkbox" id="memo-alpha"> 半透明</label><div style="display:flex;gap:4px;align-items:center"><button class="mode active" data-ime="romaji">ローマ字</button><button class="mode" data-ime="kana">かな</button><button data-close="memo-window">×</button></div></div><div class="memo-tools"><button id="memo-search-button">⌕ 検索</button><button class="paint" data-memo-color="red" aria-label="赤マーカー"></button><button class="paint" data-memo-color="blue" aria-label="青マーカー"></button><button class="paint" data-memo-color="yellow" aria-label="黄マーカー"></button><button data-memo-color="clear">白</button><button id="memo-cut">カット</button><button id="memo-copy">コピー</button><button id="memo-paste">ペースト</button></div><div id="memo-find-wrap" class="memo-search"><input id="memo-search-field" placeholder="メモ内検索"><button id="memo-find-action">検索</button><span id="memo-search-info"></span></div><div id="memo-text" class="memo-text" contenteditable="true" spellcheck="false" aria-label="メモ" role="textbox" aria-multiline="true"></div><div class="memo-footer"><span>入力方式はOSの日本語IMEを使用</span><button class="btn" data-close="memo-window">閉じる</button><span id="memo-count">0 / 10,000 文字</span></div></div>
<div class="float calc" id="calc-window" data-size="medium"><div class="float-header"><span>電卓</span><button data-close="calc-window">×</button></div><div class="calc-head"><button data-csize="small">小</button><button data-csize="medium" class="active">中</button><button data-csize="large">大</button></div><div id="calc-screen" class="calc-screen">0</div><div class="calc-grid" id="calc-buttons"></div></div>
<script src="b.js"></script></body></html>
