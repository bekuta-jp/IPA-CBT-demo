name: Discover 2016-2025 IPA AP Official Sources
on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/discover_ipa_sources.py'
      - '.github/workflows/discover-ipa-sources.yml'
permissions:
  contents: write
jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests beautifulsoup4
      - run: python tools/discover_ipa_sources.py
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/ipa-sources.json
          if ! git diff --cached --quiet; then
            git commit -m 'data: verify IPA official archive sources 2016-2025'
            git pull --rebase origin main
            git push origin HEAD:main
          fi