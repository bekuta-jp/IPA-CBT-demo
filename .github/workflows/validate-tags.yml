name: Validate Question Tags
on:
  push:
    paths:
      - 'tags/**'
      - 'tools/validate_tags.py'
      - '.github/workflows/validate-tags.yml'
      - 'sets/ap-2025-autumn.json'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate tag sidecars
        run: python tools/validate_tags.py
