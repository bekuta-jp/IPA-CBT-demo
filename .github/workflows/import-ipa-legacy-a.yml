name: Import IPA 2016-2020 AP Morning Archive
on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/import_ipa_legacy_a.py'
      - '.github/workflows/import-ipa-legacy-a.yml'
permissions:
  contents: write
jobs:
  import:
    strategy:
      fail-fast: false
      matrix:
        session:
          - 2016-spring
          - 2016-autumn
          - 2017-spring
          - 2017-autumn
          - 2018-spring
          - 2018-autumn
          - 2019-spring
          - 2019-autumn
          - 2020-october
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install OCR and PDF packages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq tesseract-ocr tesseract-ocr-jpn
          python -m pip install --disable-pip-version-check 'pymupdf>=1.24,<2' 'Pillow>=11,<13' requests pytesseract 'opencv-python-headless>=4.8,<5' 'numpy>=1.26,<3'
      - name: Diagnose missing morning headings and 80 answer positions
        run: python tools/import_ipa_legacy_a.py --session '${{ matrix.session }}' --probe