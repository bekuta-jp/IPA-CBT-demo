name: Generate Archived Subject B Answer Metadata
on:
  push:
    paths:
      - 'tools/build_b_answer_metadata.py'
      - 'tools/test_b_metadata_runtime.cjs'
      - '.github/workflows/generate-b-answer-metadata.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate provisional per-subquestion metadata for remaining 18 sessions
        run: python tools/build_b_answer_metadata.py
      - name: Verify reproducibility, references, field types and 19 catalog entries
        run: |
          python tools/build_b_answer_metadata.py --check
          python - <<'PY'
          import json
          from pathlib import Path
          manifest=json.loads(Path('sets/b-index.json').read_text())
          assert len(manifest)==19
          for entry in manifest:
              bank=json.loads(Path(entry['file']).read_text())
              meta=json.loads(Path(entry['metadataFile']).read_text())
              assert meta['schemaVersion']=='ap-b-field-meta-v1' and meta['setId']==bank['id']
              assert set(meta['questions'])=={str(q['number']) for q in bank['questions']}
              for q in bank['questions']:
                  spec=meta['questions'][str(q['number'])]
                  groups={f['id'] for f in q['fields']}
                  assert set(spec['completeGroups'])<=groups
                  assert all(f['parent'] in groups for f in spec['fields'])
                  assert all((f.get('grading')!='exact') or (f.get('verified') and f.get('correct')) for f in spec['fields'])
          print('PASS: 19 linked metadata sets, no unverified exact-grading fields')
          PY
      - name: Test Subject B UI schema/fallback with actual application functions
        run: node tools/test_b_metadata_runtime.cjs
      - name: Publish official-answer-derived metadata without modifying source PDFs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sets/b-index.json sets/b-meta-*.json
          if ! git diff --cached --quiet; then
            git commit -m 'data: add provisional per-subquestion metadata to 18 historical B sessions'
            git pull --rebase origin main
            git push origin HEAD:main
          fi