/* v2 setup and result dialogs */
.modal.setup{max-width:840px}.modal.results{max-width:710px}.setup-section{margin:15px 0 11px;padding:14px 15px;background:#f8fafc;border:1px solid #d8e0e8;border-radius:6px}.setup-section h2{font-size:15px;margin:0 0 9px;color:#173e69}.settings-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.fieldset{border:1px solid #d6dee5;background:white;padding:12px;border-radius:5px}.fieldset legend{font-weight:700;font-size:13px}.fieldset label{display:block;margin:6px 0;line-height:1.45}.set-list{max-height:195px;overflow:auto;border:1px solid #d6dce4;background:white;padding:6px 10px;border-radius:5px}.set-item{display:flex;align-items:center;gap:10px;padding:8px 4px;border-bottom:1px solid #eceff2}.set-item:last-child{border-bottom:0}.set-item input{width:18px;height:18px;accent-color:#164677}.set-meta{flex:1;line-height:1.35}.set-meta b{font-weight:600}.set-meta small{display:block;color:#667788}.set-count{color:#37536f;font-variant-numeric:tabular-nums}.setup-controls{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px}.setup-controls input[type=number]{width:82px;padding:7px;border:1px solid #abb8c6;border-radius:4px}.setup-controls select{padding:7px;border:1px solid #abb8c6;border-radius:4px}.setup-prompt{margin:8px 0 0;color:#52657a;font-size:12px}.status-message{color:#284e74;line-height:1.6;font-size:13px;white-space:pre-wrap}.status-message.error{color:#b51a31}.badge-demo{font-size:10px;background:#e8f0fa;padding:3px 6px;color:#355e8c;border-radius:20px;margin-left:6px}.score-card{text-align:center;border:1px solid #d2e2f2;background:#f3f8ff;padding:23px;border-radius:8px;margin:17px 0}.score-card strong{font-size:43px;color:#164677;display:block}.score-card p{margin:4px 0;color:#546272}.result-actions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.result-actions button{white-space:normal;line-height:1.4;min-height:45px}.source-line{font-size:11px;color:#687b8b;margin-top:20px;border-top:1px dashed #cfd8e2;padding-top:9px}. /* v3: 公式チュートリアル画像を参考にした操作再現。非公式UI。 */
.q-opt-list{display:flex;flex-wrap:wrap;align-items:flex-start;column-gap:clamp(22px,3vw,65px);row-gap:12px;margin-top:18px}
.q-opt{display:flex;flex:0 1 auto;max-width:100%;min-width:min(100%,70px);gap:8px;align-items:flex-start;line-height:1.8}
.q-opt .letter{flex-shrink:0}
.q-opt>div:last-child{min-width:0;white-space:pre-wrap;overflow-wrap:anywhere}
.q-opt:has(.option-image){width:100%;flex-basis:100%}
#answer-pane .ah{font-size:17px;margin-bottom:24px;gap:10px;cursor:pointer;user-select:none}
#answer-pane .ah:before{content:none}

#review-check:checked{background:#fff;border:1px solid #324f76}
#review-check:checked:after{content:'✔';position:absolute;top:-6px;left:1px;font-size:19px;color:#174978}
#review-check:disabled{cursor:default}
body.exam-running .q-scroll,body.exam-running #answer-pane,body.exam-running #status-pane{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}

#memo-window .memo-tools button:hover{border-color:#8c9eb6;background:#e5edf6}
#memo-window .memo-tools button:focus-visible{outline:2px solid #f5bd36;outline-offset:0}
#memo-window .memo-tools #memo-search-toggle{border:1px solid #c4cbd5;display:inline-flex;gap:4px;align-items:center;background:#fff}
.marker-group{display:inline-flex;align-items:center;gap:2px}
#memo-window .memo-tools .swatch-btn{width:15px;min-width:15px;height:17px;min-height:17px;padding:0;border:1px solid #a9a9a9}
#memo-window .memo-tools .swatch-btn.red{background:#f05161}
#memo-window .memo-tools .swatch-btn.blue{background:#174dff}
#memo-window .memo-tools .swatch-btn.yellow{background:#ffcd21}
#memo-window .memo-tools .swatch-btn.none{background:linear-gradient(125deg,#fff 43%,#d33d3d 46%,#d33d3d 52%,#fff 55%)}
.memo-tool-divider{width:1px;height:18px;background:#b7bdc7;margin:0 2px}
#memo-window .memo-searchbar{display:flex;gap:5px;flex:0 0 30px;min-height:30px;align-items:center;padding:2px 7px;background:#f6f7f9;border-bottom:1px solid #d9e2e9}
#memo-window .memo-searchbar[hidden]{display:none!important}
#memo-window .memo-searchbar input{max-width:220px;flex:1;min-width:45px;padding:2px 4px;font-size:12px;height:22px;border:1px solid #c4a8a8}
#memo-window .memo-searchbar button{padding:2px 4px;border:1px solid #c6ced9;border-radius:2px;background:#fff;height:22px;font-size:11px}
#memo-window .memo-searchbar #memo-hits{font-size:11px;color:#748096;min-width:30px}
#memo-window .memo-edit{flex:1;min-height:65px;overflow:auto;padding:7px 11px;font-size:13px;line-height:20px;outline:none;background:repeating-linear-gradient(to bottom,#fff 0,#fff 19px,#dbe7f0 19px,#dbe7f0 20px)}
#memo-window .memo-status{flex:0 0 19px;min-height:19px;padding:1px 7px 1px 4px;justify-content:flex-end;background:#fff;color:#8e95a0;border-top:0;font-size:10px}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
#memo-window .memo-footer{height:36px;min-height:36px;flex:0 0 36px;display:flex;align-items:center;justify-content:center;background:#edf0f5;border-top:1px solid #d6dae1}
#memo-window #memo-close{min-width:86px;height:23px;background:#174978;color:white;border:1px solid #7e99b4;border-radius:1px;font-size:12px}
@media(max-width:600px){#memo-window{width:96vw;min-width:0;height:70vh;top:50%;left:50%;max-height:85vh}#memo-window .memo-tools{gap:2px}#memo-window .memo-tools button{font-size:10px}#answer-pane .choice{display:inline-block;width:23%;margin:4px 1%}}

/* 問題セット選択：公式過去問と試作問題を明確に分ける */
.exam-set-group{padding:10px 12px 12px;margin:7px 0 14px;border:1px solid #c7d5e2;background:#fff;border-radius:5px}
.exam-set-group h3{margin:0 0 4px;font-size:15px;color:#164677}
.exam-set-group>p{margin:0 0 8px;color:#5a6b7c;font-size:12px}
.exam-set-group + .exam-set-group{border-color:#b7b8bb;background:#f8f8f8}
.exam-set-group .set-item{margin:0}
.exam-set-group input[type=radio],.exam-set-group input[type=checkbox]{width:18px;height:18px;accent-color:#174e83;flex:0 0 auto}
.badge-real{display:inline-block;background:#dbece2;color:#205c39;border-radius:12px;padding:2px 8px;margin-left:7px;font-size:11px}

/* 受験時の操作に合わせた見直しフラグ表示（2026-11） */
#answer-pane #choices{position:relative}
#answer-pane.review-marked #choices::before{
  content:"";position:absolute;top:0;bottom:0;left:-9px;width:4px;
  background:#d12f45;pointer-events:none;
}
</style>
</head>
<body>
<div id="app">
  <header id="header">
   <div id="brand"><div id="brandmark">AP</div><div id="brandtext"><strong>応用情報技術者試験</strong>CBT 科目A 模擬環境<br>非公式・ブラウザ動作</div></div>
   <div id="heading">応用情報技術者試験　科目A 練習<span id="subheading">準備中</span></div>
   <div id="header-actions"><div id="time-line">残り時間 <strong id="remaining">--:--:--</strong></div><div id="control-line"><span class="tiny">白黒反転</span><button type="button" class="switch" id="invert-toggle" aria-label="白黒反転" aria-pressed="false"></button><button class="btn" id="memo-btn">メモ</button><button class="btn cobalt" id="ref-btn">参考資料</button><button class="btn" id="end-btn">試験終了</button></div></div>
  </header>
  <main id="workspace">
   <section id="question-pane"><div class="zoomrow"><label for="zoom">拡大・縮小</label><input type="range" min="80" max="160" step="5" value="100" id="zoom"><span id="zoom-number">100 %</span></div><div class="q-scroll" id="question-scroll"><article class="q-body" id="question-body"></article></div></section>
   <div id="splitter" title="左右の表示幅をドラッグして変更"></div>
   <aside id="answer-pane"><label class="ah"><input id="review-check" type="checkbox" aria-label="この問題を後で見直す"><span id="answer-title">問1</span></label><div id="choices"></div></aside>
   <section id="status-pane"><div class="status-main" id="status-grid"></div><div class="status-key"><div class="keyrow"><span class="swatch"></span>未解答</div><div class="keyrow"><span class="swatch green"></span>解答済み</div><div class="keyrow"><span class="swatch red"></span>後で見直すもの</div><div class="keyrow"><span class="swatch yellow"></span>解答中</div></div></section>
  </main>
  <footer id="foot"><button class="btn" id="status-btn">解答状況</button><button class="btn light" id="calc-btn">電卓</button><button class="btn light push" id="flag-btn">後で見直す</button><button class="btn" id="prev-btn">前の問題</button><button class="btn" id="next-btn">次の問題</button></footer>
 </div>
<div id="memo-window" class="floating" role="dialog" aria-label="メモ">
 <div class="floattitle memo-title">
  <label class="memo-transparent-label"><input type="checkbox" id="memo-transparent"> 半透明</label>
  <span class="memo-title-actions"><button id="memo-romaji" type="button" class="is-active" aria-pressed="true">ローマ字</button><button id="memo-kana" type="button" aria-pressed="false">かな</button><button type="button" class="float-close" data-close="memo-window" aria-label="閉じる">×</button></span>
 </div>
 <div class="floating-content">
  <div class="memo-tools" role="toolbar" aria-label="メモの操作">
   <button id="memo-search-toggle" type="button" title="検索">⌕ <span>検索</span></button>
   <span class="marker-group" aria-label="マーカー">
    <button type="button" data-marker="red" class="swatch-btn red" aria-label="赤色マーカー" title="赤色マーカー"></button>
    <button type="button" data-marker="blue" class="swatch-btn blue" aria-label="青色マーカー" title="青色マーカー"></button>
    <button type="button" data-marker="yellow" class="swatch-btn yellow" aria-label="黄色マーカー" title="黄色マーカー"></button>
    <button type="button" data-marker="none" class="swatch-btn none" aria-label="マーカー解除" title="マーカー解除"></button>
   </span>
   <span class="memo-tool-divider" aria-hidden="true"></span>
   <button id="memo-cut" type="button" title="メモで選択した文字を切り取り">✂ カット</button>
   <button id="memo-copy" type="button" title="メモで選択した文字をコピー">▣ コピー</button>
   <button id="memo-paste" type="button" title="メモ内でコピーした文字を貼り付け">▣ ペースト</button>
  </div>
  <div id="memo-searchbar" class="memo-searchbar" hidden>
   <label for="memo-search" aria-hidden="true">⌕</label><input id="memo-search" type="search" placeholder="検索する文字" aria-label="メモを検索" autocomplete="off">
   <span id="memo-hits" aria-live="polite">0/0</span>
   <button id="memo-find-prev" type="button" aria-label="前の検索結果">▲</button><button id="memo-find-next" type="button" aria-label="次の検索結果">▼</button>
   <button id="memo-search-close" type="button" aria-label="検索欄を閉じる">×</button>
  </div>
  <div id="memo-input" class="memo-edit" contenteditable="true" role="textbox" aria-label="試験中のメモ" aria-multiline="true" spellcheck="false"></div>
  <div class="memo-status"><span id="memo-input-note" class="sr-only" aria-live="polite">OSの日本語IMEで入力方式を切り替えます</span><span id="memo-count">0 / 10,000 文字</span></div>
  <div class="memo-footer"><button id="memo-close" type="button">閉じる</button></div>
 </div>
</div>
<div id="calc-window" data-size="medium" class="floating" role="dialog" aria-label="電卓"><div class="floattitle"><span>電卓</span><button class="float-close" data-close="calc-window" aria-label="閉じる">×</button></div><div class="floating-content"><div class="calc-top"><button type="button" data-calc-size="small">小</button><button type="button" class="active" data-calc-size="medium">中</button><button type="button" data-calc-size="large">大</button></div><div class="calc-display" id="calc-display" aria-live="polite">0</div><div class="calcgrid" id="calc-grid"></div></div></div>
<div id="modal-layer"><div class="modal" id="modal-content"></div></div>
<script src="demo-data.js" defer></script>
<script src="app.js" defer></script>
</body>
</html>
